AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD Pipeline with GitHub using CodeStar Connection and Manual Approval

Parameters:
  CodeStarConnectionArn:
    Type: String
    Default: arn:aws:codeconnections:ap-northeast-1:515966492939:connection/8216290d-87dd-49a1-8c1d-15288d0657ed
    Description: ARN of the CodeStar Connection for GitHub
  GitHubRepo:
    Type: String
    Default: sample-stf
    Description: GitHub repository in format owner/repo
  GitHubBranch:
    Type: String
    Default: main
  S3Bucket:
    Type: String
    Default: samplesff
    Description: S3 bucket for Lambda deployment package

Resources:

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PipelineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  LambdaBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: LambdaBuild
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: S3_BUCKET
            Value: !Ref S3Bucket
      Source:
        Type: CODEPIPELINE
      Artifacts:
        Type: CODEPIPELINE

  CICDPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: SfnLambdaPipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref S3Bucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: true

        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref LambdaBuildProject

        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: 1
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: DeployCF
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: 1
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ActionMode: REPLACE_ON_FAILURE
                StackName: sfn-lambda-stack
                Capabilities: CAPABILITY_NAMED_IAM
                TemplatePath: BuildOutput::cloudformation/sfn-lambda-cf.yaml
              RoleArn: !GetAtt PipelineRole.Arn
